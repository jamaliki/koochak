train:
  max_steps: 1000
  log_every: 50
  eval_every: 200
  ckpt_every: 200
  grad_accum: 1
  grad_clip_norm: null
  scheduler_step: step
  amp: fp32   # fp32 | fp16 | bf16
  seed: 42
  device: cuda
  out_dir: ./runs/mnist
  keep_last_k: 3

  # Strict config validation defaults
  strict_config: true         # raise on unknown/unused keys
  config_warn_unknown: true   # when strict_config=false, warn instead of raising

optim:
  optimizer:
    name: AdamW
    lr: 0.0003
    weight_decay: 0.01
  scheduler:
    name: cosine_warmup
    warmup_steps: 100
    T_max: null  # uses train.max_steps if null
    eta_min: 0.0

data:
  data_dir: ./data
  batch_size: 128
  num_workers: 4

wandb:
  enabled: false
  project: koochak-mnist

logging:
  csv_path: ./runs/mnist/log.csv
  jsonl_path: ./runs/mnist/log.jsonl
