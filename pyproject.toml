[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koochak"
version = "0.1.0"
description = "Function-first training loop for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "omegaconf>=2.3",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["koochak*"]
