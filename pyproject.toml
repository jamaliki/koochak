[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-kaveh"
version = "0.1.0"
description = "A compact hierarchical Atom14 protein diffusion model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.5",
  "numpy>=1.26",
  "omegaconf>=2.3",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]
dev = ["pytest>=8"]
cuda = [
  "triton>=2.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[project.scripts]
hierarchical-kaveh-train = "hierarchical_kaveh.train:main"
hierarchical-kaveh-sample = "hierarchical_kaveh.sample:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hierarchical_kaveh*"]

[tool.setuptools.package-data]
hierarchical_kaveh = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
