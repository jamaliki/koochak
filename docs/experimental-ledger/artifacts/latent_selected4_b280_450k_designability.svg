<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">b280 length-256 continuation at 450k: strict designability by arm</title>
  <desc id="desc">Strict designability is CA RMSD below 2 angstroms and mean ESMFold pLDDT above 80. Rates are 50.9, 42.9, 41.5, and 31.2 percent.</desc>
  <rect width="900" height="430" fill="#fbfafc"/>
  <text x="56" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#211b3d">b280 L256 continuation, checkpoint 450k</text>
  <text x="56" y="64" font-family="Arial, sans-serif" font-size="14" fill="#625b78">Strict designability: CA RMSD &lt; 2 A and mean ESMFold pLDDT &gt; 80 (n=224 per arm)</text>
  <line x1="80" y1="340" x2="850" y2="340" stroke="#6e6683" stroke-width="1"/>
  <line x1="80" y1="90" x2="80" y2="340" stroke="#6e6683" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#625b78">
    <text x="48" y="344">0%</text><text x="40" y="219">25%</text><text x="40" y="94">50%</text><text x="800" y="344">60%</text>
    <line x1="80" y1="236" x2="850" y2="236" stroke="#e4e0eb"/><line x1="80" y1="132" x2="850" y2="132" stroke="#e4e0eb"/>
  </g>
  <g fill="#7461b8">
    <rect x="130" y="128" width="120" height="212" rx="4"/><rect x="320" y="161" width="120" height="179" rx="4"/><rect x="510" y="167" width="120" height="173" rx="4"/><rect x="700" y="210" width="120" height="130" rx="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#211b3d" text-anchor="middle">
    <text x="190" y="116">50.9%</text><text x="380" y="149">42.9%</text><text x="570" y="155">41.5%</text><text x="760" y="198">31.2%</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#211b3d" text-anchor="middle">
    <text x="190" y="365">r1_z3</text><text x="190" y="381">b0.01 c0.125</text>
    <text x="380" y="365">r0_z3</text><text x="380" y="381">b0.3 c0.125</text>
    <text x="570" y="365">r1_z4</text><text x="570" y="381">b0.03 c0.25</text>
    <text x="760" y="365">r2_z2</text><text x="760" y="381">b0.1 c0.125</text>
  </g>
  <text x="56" y="415" font-family="Arial, sans-serif" font-size="12" fill="#625b78">Source: durable ESMFold panel_summary.json + decoded all-atom summary.json; exact cells are in the companion CSV.</text>
</svg>
